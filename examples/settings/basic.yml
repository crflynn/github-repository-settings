# Minimal starting point. Set the owner and repository in the CLI configuration before applying.
repository:
  description: Example repository managed by this action
  visibility: private
  has_issues: true
  topics:
    - managed
actions:
  permissions:
    enabled: true
    allowed_actions: selected
    sha_pinning_required: true
    selected_actions:
      github_owned_allowed: true
      verified_allowed: true
      patterns_allowed:
        - acme/*
  workflow:
    default_workflow_permissions: read
    can_approve_pull_request_reviews: false
