repository:
  description: Apply GitHub repository settings from a YAML manifest
  visibility: public
  default_branch: main
  has_projects: false
  has_wiki: false
  has_discussions: false
  has_downloads: false
  allow_merge_commit: false
  allow_rebase_merge: false
  allow_update_branch: true
  delete_branch_on_merge: true
environments:
  - name: release
rulesets:
  - name: protect-main
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include: ["~DEFAULT_BRANCH"]
        exclude: []
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 1
          required_review_thread_resolution: true
      - type: deletion
      - type: non_fast_forward
